name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (the comment names the release); Dependabot
      # keeps them current. uv is pinned to an exact version for the same reason, but
      # Dependabot cannot bump it: change `uv==` below together with a fresh `uv lock`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          # --locked fails if uv.lock is out of date with pyproject.toml
          uv sync --locked --extra test

      - name: Run tests
        run: uv run --locked pytest tests/ -q
